<!DOCTYPE html>
<html lang="en">
  <head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gym Management System</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        background: #f4f5f7;
        color: #1f2937;
        display: flex;
        align-items: center;

        height: 100vh;
        margin: 0;
      }
      .card { max-width: 28rem; text-align: center; padding: 2rem; }
      h1 { font-size: 1.25rem; margin-bottom: 0.5rem; }
      p { color: #6b7280; font-size: 0.95rem; }
      code { font-size: 0.85rem; background: #e5e7eb; padding: 0.1rem 0.35rem; border-radius: 4px; }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Gym Management System</h1>
      <p id="status">Starting local server&hellip;</p>
      <p id="detail"></p>
    </div>
    <script>
      // Shell replaces this page with http://127.0.0.1:<port>/ once healthy.
      // If boot fails the shell injects the error into #status/#detail.
    </script>
  </body>
</html>
