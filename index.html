<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gym Management — Documentation</title>
  <style>
    body { margin: 0; padding: 2rem; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: #fafafa; color: #222; }
    .wrapper { display: flex; min-height: 100vh; }
    .sidebar { width: 220px; background: #fff; border-right: 1px solid #ddd; padding: 1rem; overflow-y: auto; }
    .sidebar h3 { margin-top: 0; font-size: 1rem; }
    .sidebar select { width: 100%; margin-top: 0.5rem; padding: 0.5rem; font-size: 0.9rem; }
    .main { flex: 1; padding: 1rem; background: #fafafa; }
    .content { background: #fff; padding: 1.5rem; border-radius: 4px; line-height: 1.6; }
    .content h1, .content h2, .content h3 { margin-top: 1.5em; }
    .content code { background: #eee; padding: 0.2rem 0.4rem; border-radius: 2px; }
    .content pre { overflow-x: auto; }
  </style>
</head>
<body>
  <div class="wrapper">
    <aside class="sidebar">
      <h3>Documents</h3>
      <select id="file-select" onchange="renderFile(this.value)">
        <option value="">-- Select a file --</option>
        <!-- options injected by script -->
      </select>
    </aside>
    <main class="main">
      <article class="content" id="output">Select a file to view its content.</article>
    </main>
  </div>

  <script>
    // window.api is injected by preload.js after nodeIntegration loads
    const { loadFiles, renderMarkdown } = window.api;

    const select = document.getElementById('file-select');
    const output = document.getElementById('output');

    // Populate the dropdown with file names
    loadFiles().forEach(name => {
      const opt = document.createElement('option');
      opt.value = name;
      opt.textContent = name;
      select.appendChild(opt);
    });

    // When the user chooses a file, render its markdown
    select.onchange = (e) => {
      const name = e.target.value;
      if (!name) { output.innerHTML = ''; return; }
      // preload's renderMarkdown expects the filename WITH .md extension
      const html = renderMarkdown(name + '.md');
      output.innerHTML = html;
    };
  </script>
</body>
</html>
