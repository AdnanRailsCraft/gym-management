# Phase 0 primary verification: Windows runner runs the full check chain.
# Machine-readable report: dist/results/report.json (uploaded as artifact
# on every run, pass or fail). Red CI = Phase 0 not proven — no prose claims.
name: windows-phase0

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Ruby (exact pin from .ruby-version)
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4.10'

      - name: Toolchain versions (recorded in report context)
        shell: pwsh
        run: |
          ruby -v
          bundle -v
          node -v
          npm -v

      - name: Run Phase 0 check chain
        shell: pwsh
        run: ./scripts/windows/run-all.ps1

      - name: Upload machine-readable report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: phase0-report
          path: |
            dist/results/report.json
            dist/results/checks.jsonl
          if-no-files-found: warn

      - name: Upload precompiled assets log on failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: phase0-failure-context
          path: |
            log/*.log
            tmp/build/*.log
          if-no-files-found: ignore

  desktop-shell:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install frontend toolchain
        working-directory: desktop
        shell: pwsh
        run: npm install

      - name: Build Tauri shell (release)
        working-directory: desktop
        shell: pwsh
        run: npm run tauri build

      - name: Assert shell binary
        shell: pwsh
        run: |
          $exe = "desktop/src-tauri/target/release/gym-desktop.exe"
          if (-not (Test-Path $exe)) { Write-Error "missing $exe"; exit 1 }
          $size = (Get-Item $exe).Length
          if ($size -lt 1MB) { Write-Error "suspiciously small: $size bytes"; exit 1 }
          Write-Host "exe ok: $exe ($size bytes)"

      - name: Upload shell binary
        uses: actions/upload-artifact@v5
        with:
          name: gym-desktop-exe
          path: desktop/src-tauri/target/release/gym-desktop.exe
          if-no-files-found: error

  installer:
    needs: [windows, desktop-shell]
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4.10'
          bundler-cache: false

      - name: Record toolchain
        shell: pwsh
        run: |
          ruby --version
          bundle --version

      - name: Download shell binary
        uses: actions/download-artifact@v5
        with:
          name: gym-desktop-exe
          path: desktop/src-tauri/target/release

      - name: Stage portable tree + compile installer
        shell: pwsh
        run: |
          $env:GMS_RESULT_DIR = "dist\results"
          ./scripts/windows/run-all.ps1 -Steps 03-stage,04-installer
          exit $LASTEXITCODE

      - name: Upload installer artifact
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: phase0-installer
          path: |
            dist/GymManagementSystem-Setup-*.exe
            dist/results/report.json
          if-no-files-found: error
